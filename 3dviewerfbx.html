<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Visor 3D — GLB</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #1a1a1a;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #1a1a1a;
        color: #fff;
        font-family: monospace;
        font-size: 14px;
        z-index: 10;
        transition: opacity 0.5s;
      }
      #loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #progress-bar {
        width: 200px;
        height: 2px;
        background: #333;
        margin-top: 12px;
        border-radius: 2px;
        overflow: hidden;
      }
      #progress-fill {
        height: 100%;
        width: 0%;
        background: #fff;
        transition: width 0.2s;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <span id="loading-text">Cargando modelo...</span>
      <div id="progress-bar"><div id="progress-fill"></div></div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      // ESCENA
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a1a);

      // CÁMARA con rango ajustado para evitar Z-fighting
      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.01, 100);
      camera.position.set(0, 1, 3);

      // RENDERER con corrección de color
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1;
      document.body.appendChild(renderer.domElement);

      // ILUMINACIÓN
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1);
      dirLight.position.set(5, 10, 5);
      dirLight.castShadow = true;
      dirLight.shadow.bias = -0.001;
      dirLight.shadow.normalBias = 0.02;
      dirLight.shadow.camera.near = 0.1;
      dirLight.shadow.camera.far = 50;
      scene.add(dirLight);

      // CONTROLES
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      // CARGAR GLB
      const loader = new GLTFLoader();
      loader.load(
        "3Dobj\boss.glb", // <-- cambia por el nombre de tu archivo
        (gltf) => {
          const model = gltf.scene;

          // Corregir materiales y sombras en cada mesh
          model.traverse((child) => {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;
              child.material.side = THREE.FrontSide;
            }
          });

          scene.add(model);

          // Centrar el modelo automáticamente
          const box = new THREE.Box3().setFromObject(model);
          const center = box.getCenter(new THREE.Vector3());
          model.position.sub(center);

          // Ocultar pantalla de carga
          document.getElementById("loading").classList.add("hidden");
        },
        (xhr) => {
          if (xhr.total > 0) {
            const pct = ((xhr.loaded / xhr.total) * 100).toFixed(0);
            document.getElementById("loading-text").textContent = `Cargando modelo... ${pct}%`;
            document.getElementById("progress-fill").style.width = pct + "%";
          }
        },
        (error) => {
          console.error("Error al cargar el modelo:", error);
          document.getElementById("loading-text").textContent = "Error al cargar el modelo";
        },
      );

      // LOOP DE ANIMACIÓN
      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();

      // RESPONSIVE
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
