<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UI Switch-like Menu</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Ubuntu:wght@400;700&display=swap");

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: #2b2b2b;
        overflow: hidden;
        height: 100vh; /* 100% del alto de la pantalla */
        display: flex;
        flex-direction: column;
        justify-content: center; /* Centra el contenido verticalmente */
      }

      /* --- Header --- */
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 4vh 4vw;
      }

      .profile-icon {
        width: 8vh;
        height: 8vh;
        background-color: #555;
        border-radius: 50%;
      }

      .battery {
        display: flex;
        align-items: center;
      }

      .battery-body {
        width: 6vh;
        height: 3vh;
        border: 0.3vh solid white;
        border-radius: 0.5vh;
        padding: 0.3vh;
        display: flex;
      }

      .battery-level {
        width: 85%;
        height: 100%;
        background-color: white;
      }

      .battery-tip {
        width: 0.6vh;
        height: 1.5vh;
        background-color: white;
        border-radius: 0 0.5vh 0.5vh 0;
      }

      /* --- Game Carousel --- */
      .carousel {
        display: flex;
        align-items: center; /* Centra los juegos verticalmente dentro del carrusel */
        gap: 2vw;
        padding: 4vh 5vw; /* Espacio extra para que el hover no se corte */
        margin-top: 4vh;
        margin-bottom: 4vh;

        /* Efecto de carrusel deslizable (Scroll) */
        overflow-x: auto;
        scroll-behavior: smooth;
        scroll-snap-type: x mandatory; /* Imanta los juegos al hacer scroll */
      }

      /* Ocultar la barra de desplazamiento horizontal para diseño limpio */
      .carousel::-webkit-scrollbar {
        display: none;
      }

      .game-tile {
        width: 35vh;
        height: 35vh;
        background-color: #333;
        flex-shrink: 0; /* Evita que los juegos se aplasten si hay muchos */
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        /* Redondeamos un poco los bordes para darle toque moderno */
        border-radius: 1vh;
        overflow: hidden;

        scroll-snap-align: center; /* Punto de imantación del scroll */

        /* Transición suave para el efecto hover */
        transition:
          transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275),
          box-shadow 0.2s ease,
          background-color 0.2s ease;
      }

      .game-tile a,
      .game-tile img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .game-empty {
        border: 0.2vh solid #444;
      }

      /* Hover de los juegos */
      .game-tile:hover {
        transform: scale(1.15) translateY(-0.5vh);
        background-color: #5c5c5c;
        box-shadow:
          0 0 0 0.5vh #00ffd6,
          /* Borde iluminado tipo Switch */ 0 1.5vh 3vh rgba(0, 0, 0, 0.4);
      }

      /* --- System Menu --- */
      .system-menu {
        display: flex;
        justify-content: center; /* Centra horizontalmente */
        align-items: center; /* Centra verticalmente */
        gap: 2vw;
        margin-top: 6vh;
        margin-bottom: 6vh;
      }

      .sys-btn {
        width: 10vh;
        height: 10vh;
        background-color: #4a4a4a;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition:
          transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275),
          box-shadow 0.2s ease,
          background-color 0.2s ease;
      }

      .sys-btn:hover {
        transform: scale(1.15) translateY(-0.5vh);
        background-color: #5c5c5c;
        box-shadow:
          0 0 0 0.5vh #00ffd6,
          /* Borde iluminado */ 0 1.5vh 3vh rgba(0, 0, 0, 0.4);
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="profile-icon"></div>
      <div class="battery">
        <div class="battery-body">
          <div class="battery-level"></div>
        </div>
        <div class="battery-tip"></div>
      </div>
    </div>

    <div class="carousel">
      <div class="game-tile">
        <a href="juegos/sapoGuvasto/Practica individual.html"><img src="IMG/iconos/sapo.png" alt="Sapo Game" /></a>
      </div>
      <div class="game-tile">
        <a href="juegos/catpire/index.html"><img src="IMG/iconos/catpire.png" alt="Catpire Game" /></a>
      </div>
      <div class="game-tile game-empty"></div>
      <div class="game-tile game-empty"></div>
      <div class="game-tile game-empty"></div>
      <div class="game-tile game-empty"></div>
      <div class="game-tile game-empty"></div>
      <div class="game-tile game-empty"></div>
    </div>

    <div class="system-menu">
      <div class="sys-btn"></div>
      <div class="sys-btn"></div>
      <div class="sys-btn"></div>
      <div class="sys-btn"></div>
      <div class="sys-btn"></div>
      <div class="sys-btn"></div>
      <div class="sys-btn"></div>
    </div>
  </body>
</html>
