<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Background</title>

    <style>
      :root {
        --invader-color: #2f385c;
        --pixel-size: 5px;
      }

      body {
        background-color: #2f385c77;
        margin: 0;
        height: 100vh;
        overflow: hidden;

        display: grid;

        grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
        grid-template-rows: repeat(auto-fill, minmax(60px, 1fr));
        gap: 10px;
        justify-items: center;
        align-items: center;
      }

      .space-invader {
        position: relative;
        width: calc(11 * var(--pixel-size));
        height: calc(8 * var(--pixel-size));
      }

      .space-invader::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: var(--pixel-size);
        height: var(--pixel-size);
        background: transparent;
        box-shadow:
          calc(2 * var(--pixel-size)) 0 var(--invader-color),
          calc(8 * var(--pixel-size)) 0 var(--invader-color),
          calc(3 * var(--pixel-size)) calc(1 * var(--pixel-size)) var(--invader-color),
          calc(7 * var(--pixel-size)) calc(1 * var(--pixel-size)) var(--invader-color),
          calc(2 * var(--pixel-size)) calc(2 * var(--pixel-size)) var(--invader-color),
          calc(3 * var(--pixel-size)) calc(2 * var(--pixel-size)) var(--invader-color),
          calc(4 * var(--pixel-size)) calc(2 * var(--pixel-size)) var(--invader-color),
          calc(5 * var(--pixel-size)) calc(2 * var(--pixel-size)) var(--invader-color),
          calc(6 * var(--pixel-size)) calc(2 * var(--pixel-size)) var(--invader-color),
          calc(7 * var(--pixel-size)) calc(2 * var(--pixel-size)) var(--invader-color),
          calc(8 * var(--pixel-size)) calc(2 * var(--pixel-size)) var(--invader-color),
          calc(1 * var(--pixel-size)) calc(3 * var(--pixel-size)) var(--invader-color),
          calc(2 * var(--pixel-size)) calc(3 * var(--pixel-size)) var(--invader-color),
          calc(4 * var(--pixel-size)) calc(3 * var(--pixel-size)) var(--invader-color),
          calc(5 * var(--pixel-size)) calc(3 * var(--pixel-size)) var(--invader-color),
          calc(6 * var(--pixel-size)) calc(3 * var(--pixel-size)) var(--invader-color),
          calc(8 * var(--pixel-size)) calc(3 * var(--pixel-size)) var(--invader-color),
          calc(9 * var(--pixel-size)) calc(3 * var(--pixel-size)) var(--invader-color),
          0 calc(4 * var(--pixel-size)) var(--invader-color),
          calc(1 * var(--pixel-size)) calc(4 * var(--pixel-size)) var(--invader-color),
          calc(2 * var(--pixel-size)) calc(4 * var(--pixel-size)) var(--invader-color),
          calc(3 * var(--pixel-size)) calc(4 * var(--pixel-size)) var(--invader-color),
          calc(4 * var(--pixel-size)) calc(4 * var(--pixel-size)) var(--invader-color),
          calc(5 * var(--pixel-size)) calc(4 * var(--pixel-size)) var(--invader-color),
          calc(6 * var(--pixel-size)) calc(4 * var(--pixel-size)) var(--invader-color),
          calc(7 * var(--pixel-size)) calc(4 * var(--pixel-size)) var(--invader-color),
          calc(8 * var(--pixel-size)) calc(4 * var(--pixel-size)) var(--invader-color),
          calc(9 * var(--pixel-size)) calc(4 * var(--pixel-size)) var(--invader-color),
          calc(10 * var(--pixel-size)) calc(4 * var(--pixel-size)) var(--invader-color),
          0 calc(5 * var(--pixel-size)) var(--invader-color),
          calc(2 * var(--pixel-size)) calc(5 * var(--pixel-size)) var(--invader-color),
          calc(3 * var(--pixel-size)) calc(5 * var(--pixel-size)) var(--invader-color),
          calc(4 * var(--pixel-size)) calc(5 * var(--pixel-size)) var(--invader-color),
          calc(5 * var(--pixel-size)) calc(5 * var(--pixel-size)) var(--invader-color),
          calc(6 * var(--pixel-size)) calc(5 * var(--pixel-size)) var(--invader-color),
          calc(7 * var(--pixel-size)) calc(5 * var(--pixel-size)) var(--invader-color),
          calc(8 * var(--pixel-size)) calc(5 * var(--pixel-size)) var(--invader-color),
          calc(10 * var(--pixel-size)) calc(5 * var(--pixel-size)) var(--invader-color),
          0 calc(6 * var(--pixel-size)) var(--invader-color),
          calc(2 * var(--pixel-size)) calc(6 * var(--pixel-size)) var(--invader-color),
          calc(8 * var(--pixel-size)) calc(6 * var(--pixel-size)) var(--invader-color),
          calc(10 * var(--pixel-size)) calc(6 * var(--pixel-size)) var(--invader-color),
          calc(3 * var(--pixel-size)) calc(7 * var(--pixel-size)) var(--invader-color),
          calc(4 * var(--pixel-size)) calc(7 * var(--pixel-size)) var(--invader-color),
          calc(6 * var(--pixel-size)) calc(7 * var(--pixel-size)) var(--invader-color),
          calc(7 * var(--pixel-size)) calc(7 * var(--pixel-size)) var(--invader-color);
      }
    </style>
  </head>
  <body>
    <script>
      function fillScreenWithInvaders() {
        const body = document.body;

        body.innerHTML = "";

        const screenWidth = window.innerWidth;
        const screenHeight = window.innerHeight;

        const cellWidth = 80;
        const cellHeight = 60;

        const cols = Math.ceil(screenWidth / cellWidth);
        const rows = Math.ceil(screenHeight / cellHeight);
        const totalInvaders = cols * rows;

        const fragment = document.createDocumentFragment();

        for (let i = 0; i < totalInvaders; i++) {
          const div = document.createElement("div");
          div.className = "space-invader";
          fragment.appendChild(div);
        }

        body.appendChild(fragment);

        console.log(`Se han generado ${totalInvaders} aliens.`);
      }

      fillScreenWithInvaders();

      let resizeTimer;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(fillScreenWithInvaders, 200);
      });
    </script>
  </body>
</html>
