<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Space Invader - JS Loop</title>
    <style>
      :root {
        --invader-color: #2f385c;
        --pixel-size: 5px; /* Ajusta el tamaño aquí */

        /* Definimos el tamaño total del alien en variables para que JS pueda leerlo si quisiera,
                o simplemente para mantener el orden.
                Alien ancho = 11 píxeles * tamaño pixel
                Alien alto = 8 píxeles * tamaño pixel
             */
      }

      body {
        background-color: #2f385c77;
        margin: 0;
        height: 100vh;
        overflow: hidden; /* Evitamos barras de scroll */

        /* CONFIGURACIÓN DE LA REJILLA */
        display: grid;
        /* Rellena columnas de mínimo 80px (ajustable según el zoom) */
        grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
        grid-template-rows: repeat(auto-fill, minmax(60px, 1fr));
        gap: 10px;
        justify-items: center;
        align-items: center;
      }

      /* TU CÓDIGO DEL ALIEN (INTACTO) */
      .space-invader {
        position: relative;
        width: calc(11 * var(--pixel-size));
        height: calc(8 * var(--pixel-size));
      }

      .space-invader::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: var(--pixel-size);
        height: var(--pixel-size);
        background: transparent;
        box-shadow: calc(2 * var(--pixel-size)) 0 var(--invader-color), calc(8 * var(--pixel-size)) 0 var(--invader-color),
          calc(3 * var(--pixel-size)) calc(1 * var(--pixel-size)) var(--invader-color), calc(7 * var(--pixel-size)) calc(1 * var(--pixel-size)) var(--invader-color),
          calc(2 * var(--pixel-size)) calc(2 * var(--pixel-size)) var(--invader-color), calc(3 * var(--pixel-size)) calc(2 * var(--pixel-size)) var(--invader-color),
          calc(4 * var(--pixel-size)) calc(2 * var(--pixel-size)) var(--invader-color), calc(5 * var(--pixel-size)) calc(2 * var(--pixel-size)) var(--invader-color),
          calc(6 * var(--pixel-size)) calc(2 * var(--pixel-size)) var(--invader-color), calc(7 * var(--pixel-size)) calc(2 * var(--pixel-size)) var(--invader-color),
          calc(8 * var(--pixel-size)) calc(2 * var(--pixel-size)) var(--invader-color), calc(1 * var(--pixel-size)) calc(3 * var(--pixel-size)) var(--invader-color),
          calc(2 * var(--pixel-size)) calc(3 * var(--pixel-size)) var(--invader-color), calc(4 * var(--pixel-size)) calc(3 * var(--pixel-size)) var(--invader-color),
          calc(5 * var(--pixel-size)) calc(3 * var(--pixel-size)) var(--invader-color), calc(6 * var(--pixel-size)) calc(3 * var(--pixel-size)) var(--invader-color),
          calc(8 * var(--pixel-size)) calc(3 * var(--pixel-size)) var(--invader-color), calc(9 * var(--pixel-size)) calc(3 * var(--pixel-size)) var(--invader-color),
          0 calc(4 * var(--pixel-size)) var(--invader-color), calc(1 * var(--pixel-size)) calc(4 * var(--pixel-size)) var(--invader-color),
          calc(2 * var(--pixel-size)) calc(4 * var(--pixel-size)) var(--invader-color), calc(3 * var(--pixel-size)) calc(4 * var(--pixel-size)) var(--invader-color),
          calc(4 * var(--pixel-size)) calc(4 * var(--pixel-size)) var(--invader-color), calc(5 * var(--pixel-size)) calc(4 * var(--pixel-size)) var(--invader-color),

          calc(8 * var(--pixel-size)) calc(4 * var(--pixel-size)) var(--invader-color), calc(9 * var(--pixel-size)) calc(4 * var(--pixel-size)) var(--invader-color),

          0 calc(6 * var(--pixel-size)) var(--invader-color), calc(2 * var(--pixel-size)) calc(6 * var(--pixel-size)) var(--invader-color),

          calc(3 * var(--pixel-size)) calc(7 * var(--pixel-size)) var(--invader-color), calc(4 * var(--pixel-size)) calc(7 * var(--pixel-size)) var(--invader-color),
          calc(6 * var(--pixel-size)) calc(7 * var(--pixel-size)) var(--invader-color), calc(7 * var(--pixel-size)) calc(7 * var(--pixel-size)) var(--invader-color);
      }
    </style>
  </head>
  <body>
    <script>
      function fillScreenWithInvaders() {
        const body = document.body;

        // Limpiamos el body por si redimensionamos la pantalla
        body.innerHTML = "";

        // 1. Calculamos el área de la pantalla
        const screenWidth = window.innerWidth;
        const screenHeight = window.innerHeight;

        // 2. Definimos cuánto ocupa aprox un alien (ancho + gap)
        // En el CSS pusimos minmax(80px, ...), así que usaremos 80x60 como base de celda
        const cellWidth = 80;
        const cellHeight = 60;

        // 3. Calculamos cuántos caben (Columnas * Filas)
        const cols = Math.ceil(screenWidth / cellWidth);
        const rows = Math.ceil(screenHeight / cellHeight);
        const totalInvaders = cols * rows;

        // 4. Creamos un "Fragmento".
        // Esto es un truco PRO: En lugar de pegar los divs uno a uno (que es lento),
        // los pegamos todos en memoria y luego los lanzamos al body de golpe.
        const fragment = document.createDocumentFragment();

        for (let i = 0; i < totalInvaders; i++) {
          const div = document.createElement("div");
          div.className = "space-invader";
          fragment.appendChild(div);
        }

        // 5. Inyectamos todo de golpe
        body.appendChild(fragment);

        console.log(`Se han generado ${totalInvaders} aliens.`);
      }

      // Ejecutar al cargar
      fillScreenWithInvaders();

      // Opcional: Recalcular si el usuario cambia el tamaño de la ventana
      // (Usamos un pequeño timeout para que no se ejecute mil veces mientras arrastras)
      let resizeTimer;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(fillScreenWithInvaders, 200);
      });
    </script>
  </body>
</html>
